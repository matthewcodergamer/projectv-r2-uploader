name: Unify Project V Uploader branding

on:
  push:
    paths:
      - '.github/workflows/cohesion-fix.yml'

permissions:
  contents: write

jobs:
  unify-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make icon and naming cohesive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text()

          replacements = {
            'content="V Upload"': 'content="Project V Uploader"',
            'content="Project V Upload"': 'content="Project V Uploader"',
            '<title>Project V — Archive Uploader</title>': '<title>Project V Uploader</title>',
            '<h1>Archive Transfer</h1>': '<h1>Project V Uploader</h1>',
            '<div class="brandmark" aria-hidden="true"><b>V</b><i>↑</i></div>': '<img class="brandmark unified-icon" src="./apple-touch-icon.png?v=9" alt="Project V Uploader">',
            './manifest.webmanifest?v=7': './manifest.webmanifest?v=9',
            './manifest.webmanifest?v=8': './manifest.webmanifest?v=9',
            './favicon-32.png?v=7': './apple-touch-icon.png?v=9',
            './favicon-32.png?v=8': './apple-touch-icon.png?v=9',
            './icon-192.png?v=7': './apple-touch-icon.png?v=9',
            './icon-192.png?v=8': './apple-touch-icon.png?v=9',
            './apple-touch-icon.png?v=7': './apple-touch-icon.png?v=9',
            './apple-touch-icon.png?v=8': './apple-touch-icon.png?v=9',
            './service-worker.js?v=7': './service-worker.js?v=9',
            './service-worker.js?v=8': './service-worker.js?v=9',
          }
          for old, new in replacements.items():
            s = s.replace(old, new)

          # Make the exact same PNG the in-page mark without altering layout.
          if '.brandmark.unified-icon' not in s:
            marker = '.brandmark b{'
            rule = '.brandmark.unified-icon{object-fit:cover;padding:0;background:none;border:0;box-shadow:0 8px 24px rgba(0,0,0,.35)}'
            s = s.replace(marker, rule + marker)

          p.write_text(s)

          manifest = {
            'name': 'Project V Uploader',
            'short_name': 'Project V Uploader',
            'description': 'Resumable Project V archive uploader for Cloudflare R2.',
            'start_url': './?pwa=9',
            'scope': './',
            'display': 'standalone',
            'orientation': 'portrait',
            'background_color': '#0b0e0b',
            'theme_color': '#111511',
            'icons': [
              {'src':'./icon-192.png?v=9','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'./icon-512.png?v=9','sizes':'512x512','type':'image/png','purpose':'any'},
              {'src':'./icon-512.png?v=9','sizes':'512x512','type':'image/png','purpose':'maskable'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest, indent=2) + '\n')

          Path('service-worker.js').write_text("""const CACHE='project-v-uploader-v9';
const SHELL=['./','./index.html','./manifest.webmanifest','./apple-touch-icon.png','./icon-192.png','./icon-512.png'];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(SHELL)));self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==CACHE).map(x=>caches.delete(x)))));self.clients.claim();});
self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(e.request.method!=='GET'||u.origin!==self.location.origin)return;e.respondWith(fetch(e.request,{cache:'no-store'}).then(r=>{const c=r.clone();caches.open(CACHE).then(x=>x.put(e.request,c));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./index.html'))));});
""")
          PY

      - name: Commit cohesive branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js
          git commit -m "Make Project V Uploader branding cohesive" || exit 0
          git push
