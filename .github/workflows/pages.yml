name: Deploy Project V R2 Uploader

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unify live app name and icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
            '<meta name="apple-mobile-web-app-title" content="V Upload">': '<meta name="apple-mobile-web-app-title" content="Project V Uploader">',
            '<meta name="application-name" content="Project V Upload">': '<meta name="application-name" content="Project V Uploader">',
            '<link rel="manifest" href="./manifest.webmanifest?v=7">': '<link rel="manifest" href="./manifest.webmanifest?v=9">',
            '<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=7">': '<link rel="icon" type="image/png" href="./apple-touch-icon.png?v=9">',
            '<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=7">': '',
            '<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=7">': '<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=9">',
            '<link rel="shortcut icon" href="./favicon-32.png?v=7">': '<link rel="shortcut icon" href="./apple-touch-icon.png?v=9">',
            '<title>Project V — Archive Uploader</title>': '<title>Project V Uploader</title>',
            '<div class="mark"><b>V</b><i>↑</i></div>': '<img class="mark" src="./apple-touch-icon.png?v=9" alt="Project V Uploader" style="object-fit:cover;padding:0;background:none;border:0">',
            '<h1>Archive Transfer</h1>': '<h1>Project V Uploader</h1>',
            "service-worker.js?v=7": "service-worker.js?v=9",
            "service-worker.js?v=8": "service-worker.js?v=9"
          }
          for old,new in replacements.items():
            s = s.replace(old,new)
          p.write_text(s)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
